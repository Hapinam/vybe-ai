name: Image security gate

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/publish-ghcr.yml"
      - ".github/workflows/image-security.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/publish-ghcr.yml"
      - ".github/workflows/image-security.yml"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scan checked-out files for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --no-git --redact --exit-code 1
      - name: Build runtime image
        run: docker build -t vybe:security-gate .
      - name: Scan runtime vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed vybe:security-gate
      - name: Reject common private-key and dotenv files
        run: |
          docker run --rm --entrypoint sh vybe:security-gate -c 'find /app -type f \( -name "*.pem" -o -name "*.key" -o -name ".env" -o -name ".env.*" -o -name "id_rsa" \) -print' > suspect-files.txt
          if [ -s suspect-files.txt ]; then cat suspect-files.txt; exit 1; fi
