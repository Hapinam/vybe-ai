name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and audit tool
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip install ./apps/api pip-audit
      - name: Audit installed Python dependencies
        run: python -m pip_audit --skip-editable
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit all npm dependencies
        run: npm audit --audit-level=high
