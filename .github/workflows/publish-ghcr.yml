name: Publish VYBE image to GHCR

on:
  workflow_run:
    workflows: [PR Quality Gate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify-image-changes:
    name: Verify image publication decision
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.verify.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download decision from tested workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: image-publication-decision
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: image-decision

      - name: Verify decision and changed files
        id: verify
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          path = Path("image-decision/image-publication-decision.json")
          if not path.is_file() or path.stat().st_size > 4096:
              raise SystemExit("Missing or oversized publication decision")

          decision = json.loads(path.read_text(encoding="utf-8"))

          if type(decision) is not dict or set(decision) != {
              "event", "before", "head", "run_id", "publish"
          }:
              raise SystemExit("Invalid publication decision schema")

          before = decision["before"]
          head = decision["head"]
          expected_head = os.environ["EXPECTED_HEAD"]

          if decision["event"] != "push":
              raise SystemExit("Unexpected event")

          if type(decision["run_id"]) is not int or (
              decision["run_id"] != int(os.environ["EXPECTED_RUN_ID"])
          ):
              raise SystemExit("Workflow run ID mismatch")

          if type(head) is not str or head != expected_head:
              raise SystemExit("Tested commit mismatch")

          if type(before) is not str or not re.fullmatch(r"[0-9a-f]{40}", before):
              raise SystemExit("Invalid push baseline")

          if before == "0" * 40:
              raise SystemExit("Missing push baseline")

          if type(decision["publish"]) is not bool:
              raise SystemExit("Invalid publish decision")

          subprocess.run(
              ["git", "cat-file", "-e", f"{before}^{{commit}}"],
              check=True,
          )
          subprocess.run(
              ["git", "cat-file", "-e", f"{head}^{{commit}}"],
              check=True,
          )

          subprocess.run(
              ["git", "merge-base", "--is-ancestor", before, head],
              check=True,
          )

          result = subprocess.run(
              ["git", "diff", "--name-only", "-z", "--no-renames", before, head],
              check=True,
              stdout=subprocess.PIPE,
          )

          paths = [p.decode("utf-8") for p in result.stdout.split(b"\0") if p]

          def documentation_only(path):
              return (
                  path.startswith("docs/")
                  or path in {"README.md", "CONTRIBUTING.md"}
                  or path in {
                      "apps/api/README.md",
                      "apps/web/README.md",
                      "apps/web/demo/README.md",
                      "infra/azure/README.md",
                  }
              )

          calculated = any(not documentation_only(p) for p in paths)

          if calculated != decision["publish"]:
              raise SystemExit("Publication decision mismatch")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={str(calculated).lower()}\n")

          print(f"Verified {len(paths)} changed files")
          print(f"Publish image: {calculated}")
          PY

  publish:
    needs: [verify-image-changes]
    if: needs.verify-image-changes.result == 'success' && needs.verify-image-changes.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify tested commit is current main
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)
          test "$TESTED_SHA" = "$CURRENT_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run backend tests before publishing
        run: |
          python3 -m pip install --user --require-hashes -r apps/api/requirements-test.lock && python3 -m pip install --user --no-deps -e ./apps/api
          cd apps/api
          python3 -m pytest -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Scan repository for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --no-git --redact --exit-code 1
      - name: Build image for scanning
        run: docker build -t vybe:security-gate .
      - name: Check runtime image for HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed vybe:security-gate
      - name: Inspect image for sensitive file names
        run: |
          docker run --rm --entrypoint sh vybe:security-gate -c 'find /app -type f \( -name "*.pem" -o -name "*.key" -o -name ".env" -o -name ".env.*" -o -name "id_rsa" \) -print' > suspect-files.txt
          if [ -s suspect-files.txt ]; then cat suspect-files.txt; exit 1; fi
      - name: Reverify main before publishing
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)
          test "$TESTED_SHA" = "$CURRENT_SHA"

      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Publish verified commit image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
