name: Publish VYBE image to GHCR

on:
  workflow_run:
    workflows: [PR Quality Gate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify tested commit is current main
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)
          test "$TESTED_SHA" = "$CURRENT_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run backend tests before publishing
        run: |
          python3 -m pip install --user -e "./apps/api[test]"
          cd apps/api
          python3 -m pytest -q
      - uses: docker/setup-buildx-action@v4
      - name: Scan repository for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --no-git --redact --exit-code 1
      - name: Build image for scanning
        run: docker build -t vybe:security-gate .
      - name: Check runtime image for HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed vybe:security-gate
      - name: Inspect image for sensitive file names
        run: |
          docker run --rm --entrypoint sh vybe:security-gate -c 'find /app -type f \( -name "*.pem" -o -name "*.key" -o -name ".env" -o -name ".env.*" -o -name "id_rsa" \) -print' > suspect-files.txt
          if [ -s suspect-files.txt ]; then cat suspect-files.txt; exit 1; fi
      - name: Reverify main before publishing
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)
          test "$TESTED_SHA" = "$CURRENT_SHA"

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Publish verified commit image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
