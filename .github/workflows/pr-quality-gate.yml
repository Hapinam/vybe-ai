
name: PR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.lock
            apps/api/requirements-test.lock
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --require-hashes -r requirements-test.lock && python -m pip install --no-deps -e .
      - name: Run tests
        working-directory: apps/api
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7

  integration:
    name: Full-stack integration
    runs-on: ubuntu-latest
    env:
      VYBE_FOUNDRY_MODEL_ENDPOINT: ""
      VYBE_FOUNDRY_MODEL_KEY: ""
      VYBE_FOUNDRY_MODEL_DEPLOYMENT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API
        working-directory: apps/api
        run: python -m pip install --require-hashes -r requirements.lock && python -m pip install --no-deps -e .
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start API
        working-directory: apps/api
        run: |
          python -m uvicorn vybe.main:app --host 127.0.0.1 --port 8000 > /tmp/vybe-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vybe-api.log
          exit 1
      - name: Run full-stack tests
        working-directory: apps/web
        run: npx playwright test --config=playwright.fullstack.config.ts
      - name: Upload full-stack failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-fullstack-failure
          path: |
            apps/web/test-results/
            /tmp/vybe-api.log
          retention-days: 7

  container:
    name: Container build, security and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --no-git --redact --exit-code 1
      - name: Build production image
        id: build_image
        if: ${{ !cancelled() }}
        run: docker build -t vybe:ci .
      - name: Scan vulnerabilities
        if: ${{ !cancelled() && steps.build_image.outcome == 'success' }}
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed vybe:ci
      - name: Check sensitive files
        if: ${{ !cancelled() && steps.build_image.outcome == 'success' }}
        run: |
          docker run --rm --entrypoint sh vybe:ci -c 'find /app -type f \( -name "*.pem" -o -name "*.key" -o -name ".env" -o -name ".env.*" -o -name "id_rsa" \) -print' > suspect-files.txt
          if [ -s suspect-files.txt ]; then cat suspect-files.txt; exit 1; fi
      - name: Smoke test
        if: ${{ !cancelled() && steps.build_image.outcome == 'success' }}
        run: |
          docker run -d --rm --name vybe-smoke -p 127.0.0.1:8000:8000 vybe:ci
          trap 'docker stop vybe-smoke || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/ | grep -q "VYBE"

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip install pip-audit
          python -m pip_audit --require-hashes -r apps/api/requirements-test.lock

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit npm dependencies
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  quality-gate:
    name: quality-gate
    if: always()
    needs: [api, frontend, playwright, integration, container, python-audit, npm-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | python3 -c '
          import json, sys
          jobs = json.load(sys.stdin)
          failures = [name for name, job in jobs.items() if job["result"] != "success"]
          if failures:
              print("Quality gate failed:", ", ".join(failures))
              sys.exit(1)
          print("All quality checks passed")
          '
