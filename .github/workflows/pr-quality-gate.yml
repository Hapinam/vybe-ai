
name: PR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  image-changes:
    name: Detect image-relevant changes
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.detect.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changes across entire push
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "Cannot establish push baseline." >&2
            exit 1
          fi

          git cat-file -e "${BEFORE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git merge-base --is-ancestor "$BEFORE_SHA" "$HEAD_SHA"

          python3 - <<'PY'
          import os
          import subprocess
          import sys

          before = os.environ["BEFORE_SHA"]
          head = os.environ["HEAD_SHA"]

          result = subprocess.run(
              ["git", "diff", "--name-only", "-z", "--no-renames", before, head],
              check=True,
              stdout=subprocess.PIPE,
          )

          paths = [p.decode("utf-8") for p in result.stdout.split(b"\0") if p]

          def documentation_only(path):
              return (
                  path.startswith("docs/")
                  or path in {"README.md", "CONTRIBUTING.md"}
                  or path in {
                      "apps/api/README.md",
                      "apps/web/README.md",
                      "apps/web/demo/README.md",
                      "infra/azure/README.md",
                  }
              )

          publish = any(not documentation_only(path) for path in paths)

          if not paths:
              print("No changed paths; skipping image publication.")
          else:
              print(f"Changed files: {len(paths)}")
              print(f"Image publication required: {publish}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={str(publish).lower()}\n")
          PY

      - name: Save image publication decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PUBLISH: ${{ steps.detect.outputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          decision = {
              "event": os.environ["EVENT_NAME"],
              "before": os.environ.get("BEFORE_SHA", ""),
              "head": os.environ["HEAD_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "publish": os.environ["PUBLISH"] == "true",
          }

          with open("image-publication-decision.json", "w", encoding="utf-8") as file:
              json.dump(decision, file, sort_keys=True)
          PY

      - name: Upload image publication decision
        uses: actions/upload-artifact@v7
        with:
          name: image-publication-decision
          path: image-publication-decision.json
          if-no-files-found: error
          retention-days: 7
  api:
    name: API tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[test]"
      - name: Run tests
        working-directory: apps/api
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  integration:
    name: Full-stack integration
    runs-on: ubuntu-latest
    env:
      VYBE_FOUNDRY_MODEL_ENDPOINT: ""
      VYBE_FOUNDRY_MODEL_KEY: ""
      VYBE_FOUNDRY_MODEL_DEPLOYMENT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API
        working-directory: apps/api
        run: python -m pip install -e .
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start API
        working-directory: apps/api
        run: |
          python -m uvicorn vybe.main:app --host 127.0.0.1 --port 8000 > /tmp/vybe-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vybe-api.log
          exit 1
      - name: Run full-stack tests
        working-directory: apps/web
        run: npx playwright test --config=playwright.fullstack.config.ts
      - name: Upload full-stack failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-fullstack-failure
          path: |
            apps/web/test-results/
            /tmp/vybe-api.log
          retention-days: 7

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vybe:ci .
      - name: Smoke test
        run: |
          docker run -d --rm --name vybe-smoke -p 8000:8000 vybe:ci
          trap 'docker stop vybe-smoke || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/ | grep -q "VYBE"

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scan for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --no-git --redact --exit-code 1
      - name: Build image
        run: docker build -t vybe:security-gate .
      - name: Scan vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed vybe:security-gate
      - name: Check sensitive files
        run: |
          docker run --rm --entrypoint sh vybe:security-gate -c 'find /app -type f \( -name "*.pem" -o -name "*.key" -o -name ".env" -o -name ".env.*" -o -name "id_rsa" \) -print' > suspect-files.txt
          if [ -s suspect-files.txt ]; then cat suspect-files.txt; exit 1; fi

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip install ./apps/api pip-audit
          python -m pip_audit --skip-editable
      - name: Audit npm dependencies
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  quality-gate:
    name: quality-gate
    if: always()
    needs: [image-changes, api, frontend, playwright, integration, container, security, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | python3 -c '
          import json, sys
          jobs = json.load(sys.stdin)
          failures = [name for name, job in jobs.items() if job["result"] != "success"]
          if failures:
              print("Quality gate failed:", ", ".join(failures))
              sys.exit(1)
          print("All quality checks passed")
          '
