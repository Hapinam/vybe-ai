[project]
name = "vybe-api"
version = "0.1.0"
description = "VYBE synthetic football match intelligence API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx2>=2.13,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
