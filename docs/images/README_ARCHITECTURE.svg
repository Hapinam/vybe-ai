<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img"><title>VYBE three execution modes</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1000" height="540" rx="16" fill="#f1f5f9"/><text x="30" y="40" font-family="sans-serif" font-size="25" fill="#0f172a">VYBE | Three execution modes</text><text x="30" y="82" font-family="sans-serif" font-size="16" fill="#0f172a">Public portfolio — no backend</text><rect x="30" y="95" width="240" height="50" rx="8" fill="white" stroke="#64748b"/><text x="42" y="125" font-family="sans-serif" font-size="16" fill="#0f172a">GitHub Pages</text><rect x="330" y="95" width="290" height="50" rx="8" fill="white" stroke="#64748b"/><text x="342" y="125" font-family="sans-serif" font-size="16" fill="#0f172a">Static React + recorded JSON</text><rect x="680" y="95" width="290" height="50" rx="8" fill="white" stroke="#64748b"/><text x="692" y="125" font-family="sans-serif" font-size="16" fill="#0f172a">Browser playback</text><path d="M270 120 H325" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M620 120 H675" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="188" font-family="sans-serif" font-size="16" fill="#0f172a">Local full-stack — deterministic facts</text><rect x="30" y="205" width="240" height="50" rx="8" fill="white" stroke="#64748b"/><text x="42" y="235" font-family="sans-serif" font-size="16" fill="#0f172a">React UI</text><rect x="330" y="205" width="290" height="50" rx="8" fill="white" stroke="#64748b"/><text x="342" y="235" font-family="sans-serif" font-size="16" fill="#0f172a">FastAPI / match engine</text><rect x="680" y="205" width="290" height="50" rx="8" fill="white" stroke="#64748b"/><text x="692" y="235" font-family="sans-serif" font-size="16" fill="#0f172a">Optional Ollama tool selection</text><path d="M270 230 H325" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M620 230 H675" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="680" y="280" font-family="sans-serif" font-size="14" fill="#0f172a">Optional routing only</text><text x="30" y="330" font-family="sans-serif" font-size="16" fill="#0f172a">Historical Azure deployment — retired</text><rect x="30" y="375" width="290" height="50" rx="8" fill="white" stroke="#64748b"/><text x="42" y="405" font-family="sans-serif" font-size="16" fill="#0f172a">Container Apps: React + API</text><rect x="680" y="345" width="290" height="50" rx="8" fill="white" stroke="#64748b"/><text x="692" y="375" font-family="sans-serif" font-size="16" fill="#0f172a">Foundry model APIs</text><rect x="680" y="435" width="290" height="50" rx="8" fill="white" stroke="#64748b"/><text x="692" y="465" font-family="sans-serif" font-size="16" fill="#0f172a">Azure AI Speech</text><path d="M320 400 H490 V370 H675" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M320 400 H490 V460 H675" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="505" font-family="sans-serif" font-size="15" fill="#0f172a">Separate backend integrations; no live Azure services behind Pages.</text></svg>
